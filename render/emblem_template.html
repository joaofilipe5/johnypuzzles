<title>flagOR emblem</title>
<meta name="description" content="The Portuguese coat of arms as a living monochrome glyph mark, light or dark.">
<style>
  /* light theme (default) */
  :root{ --bg:#f6f6f4; --ink:#14161b; --mut:#8a8f99;
    --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  /* dark theme */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#050507; --ink:#e9ebf0; --mut:#5a616e } }
  :root[data-theme="dark"]{ --bg:#050507; --ink:#e9ebf0; --mut:#5a616e }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:24px;overflow:hidden}
  .stage{position:relative;width:min(86vmin,600px);aspect-ratio:1/1}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block}
  .copy{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
    animation:pop .7s ease-out both}
  .memo{color:var(--ink);font-size:clamp(13px,2vw,18px);letter-spacing:.12em;text-wrap:balance}
  .enter{color:#e8c34a;font-size:clamp(12px,1.6vw,14px);letter-spacing:.24em}
  .enter::after{content:"";display:inline-block;width:.5em;height:1.05em;vertical-align:-.15em;
    margin-left:.4em;background:#e8c34a;animation:blink 1.15s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ .copy{animation:none} .enter::after{animation:none} }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">

<div class="stage"><canvas id="c"></canvas></div>
<div class="copy">
  <div class="memo">Por mares nunca dantes navegados</div>
  <div class="enter">press enter</div>
</div>

<script>
const DATA = /*__DATA__*/ null;
</script>
<script>
(function(){
  const cvs=document.getElementById('c'), stage=cvs.parentElement;
  const ctx=cvs.getContext('2d',{alpha:false});
  const cols=DATA.cols, rows=DATA.rows, GL=DATA.glyphs, NG=GL.length;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp=(v,a,b)=>v<a?a:(v>b?b:v), easeOut=t=>1-Math.pow(1-t,3);
  const css=getComputedStyle.bind(window);
  const cssFont='"JetBrains Mono", ui-monospace, Menlo, monospace';

  const P=DATA.p.map(q=>{ const gx=q[0],gy=q[1],g=q[2];
    return {gx,gy,g, ph:Math.random()*6.2832, amp:0.5+Math.random()*0.9,
      sp:0.35+Math.random()*0.7, t0:(gy/rows)*0.5+Math.random()*0.4,
      lo:Math.max(0,g-4), hi:Math.min(NG-1,g+4), cur:g, tnext:0,
      churn:70+Math.random()*180};
  });

  let W,H,DPR,cellW,cellH,ox,oy,atlas=null,aw=0,ah=0,ink='#e9ebf0',bg='#050507';
  function readColors(){ const s=css(document.documentElement);
    ink=(s.getPropertyValue('--ink')||'#e9ebf0').trim();
    bg=(s.getPropertyValue('--bg')||'#050507').trim(); }
  function buildAtlas(){
    aw=Math.max(2,Math.ceil(cellW*DPR)); ah=Math.max(2,Math.ceil(cellH*DPR));
    atlas=[];
    for(let g=0;g<NG;g++){
      const oc=document.createElement('canvas'); oc.width=aw; oc.height=ah;
      const o=oc.getContext('2d');
      o.font='600 '+Math.max(6,(ah*0.92)|0)+'px '+cssFont;
      o.textAlign='center'; o.textBaseline='middle'; o.fillStyle=ink;
      o.fillText(GL.charAt(g), aw/2, ah/2);
      atlas.push(oc);
    }
  }
  function layout(){
    DPR=Math.min(2,window.devicePixelRatio||1);
    W=stage.clientWidth||1; H=stage.clientHeight||1;
    cvs.width=Math.floor(W*DPR); cvs.height=Math.floor(H*DPR);
    const availW=W*0.98, availH=H*0.98;
    cellW=Math.min(availW/cols, availH/(rows*1.92)); cellH=cellW*1.92;
    ox=(W-cols*cellW)/2; oy=(H-rows*cellH)/2;
    readColors(); buildAtlas();
  }
  const hx=p=>ox+(p.gx+0.5)*cellW, hy=p=>oy+(p.gy+0.5)*cellH;

  let asmStart=performance.now();
  function reassemble(){ asmStart=performance.now();
    for(const p of P){ p.sx=Math.random()*W; p.sy=Math.random()*H; } }

  const ptr={x:0,y:0,on:false};
  function setPtr(e){ if(e.offsetX!=null){ptr.x=e.offsetX;ptr.y=e.offsetY;}
    else{const r=cvs.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;} ptr.on=true; }
  cvs.addEventListener('pointermove',setPtr);
  cvs.addEventListener('pointerleave',()=>ptr.on=false);
  cvs.addEventListener('pointerdown',reassemble);
  addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key==='r'||e.key==='R') reassemble(); });
  let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(layout,120);});
  const mq=matchMedia('(prefers-color-scheme: dark)');
  const onTheme=()=>{ readColors(); buildAtlas(); };
  mq.addEventListener&&mq.addEventListener('change',onTheme);
  new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  function frame(now){
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=bg; ctx.fillRect(0,0,cvs.width,cvs.height);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    const t=now/1000, asm=reduce?1:clamp((now-asmStart)/2400,0,1);
    const dw=cellW,dh=cellH,hw=cellW/2,hh=cellH/2;
    for(let i=0;i<P.length;i++){ const p=P[i];
      const local=reduce?1:clamp((asm-p.t0*0.3)/0.72,0,1), e=easeOut(local);
      let x=p.sx+(hx(p)-p.sx)*e, y=p.sy+(hy(p)-p.sy)*e;
      if(!reduce){ x+=Math.sin(t*p.sp+p.ph)*p.amp*cellW*0.09*asm;
                   y+=Math.cos(t*p.sp*0.9+p.ph)*p.amp*cellH*0.07*asm; }
      if(ptr.on){ const ddx=x-ptr.x,ddy=y-ptr.y,d2=ddx*ddx+ddy*ddy,R=100;
        if(d2<R*R){ const d=Math.sqrt(d2)||1,f=(1-d/R)*24; x+=ddx/d*f; y+=ddy/d*f; } }
      // pump only — glyphs stay fixed, brightness pulses
      let a=reduce?0.92:0.55+0.45*Math.sin(t*p.sp*1.6+p.ph);
      a*=(0.25+0.75*e);
      if(a<0.05) continue;
      ctx.globalAlpha=a; ctx.drawImage(atlas[p.g], x-hw, y-hh, dw, dh);
    }
    requestAnimationFrame(frame);
  }
  function start(){ layout(); reassemble(); requestAnimationFrame(frame); }
  if(document.fonts&&document.fonts.load){
    Promise.race([document.fonts.load('600 16px "JetBrains Mono"'),new Promise(r=>setTimeout(r,800))]).then(start);
  } else start();
})();
</script>
